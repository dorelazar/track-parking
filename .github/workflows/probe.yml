name: Probe map data
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leaflet copy for local tests
        run: mkdir -p out/leaflet && curl -sSf -o out/leaflet/leaflet.js https://unpkg.com/leaflet@1.9.4/dist/leaflet.js && curl -sSf -o out/leaflet/leaflet.css https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
      - name: Live data for the local site
        run: git clone --quiet --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site/data
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: (cd site && python3 -m http.server 8000 > /dev/null 2>&1 &) && sleep 2 && python3 shot.py
      - name: Save to probe branch
        if: always()
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "probe output"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
