name: Probe map data
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out
      - name: Wait for the published page
        run: sleep 20; for i in $(seq 1 60); do curl -s "https://dorelazar.github.io/track-parking/?x=$RANDOM" | grep -q 'Short block north' && break; sleep 10; done
      - run: pip install --quiet playwright
      - run: python3 shot.py
      - name: Save to probe branch
        if: always()
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "probe output"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
